[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv_sql_analyst"
version = "0.1.0"
description = "OpenEnv SQL Data Analyst Agent"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
packages = ["environment", "server"]